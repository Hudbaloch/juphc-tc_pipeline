apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npminstall
spec:
  workspaces:
    - name: source
  steps:
    - name: npm-install
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  workspaces:
    - name: source
  steps:
    - name: jasmine-tests
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        npx jasmine
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build
spec:
  workspaces:
    - name: source
  steps:
    - name: docker-build
      image: docker:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Building Tax Calculator Docker image"
        docker build -t tax-calculator .